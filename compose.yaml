services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ruleshift
      POSTGRES_USER: ruleshift
      POSTGRES_PASSWORD: ${RULESHIFT_DB_PASSWORD:?Set RULESHIFT_DB_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ruleshift-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruleshift -d ruleshift"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  ruleshift-postgres:
